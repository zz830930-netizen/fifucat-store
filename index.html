<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肥富吉貴 × 啵吉</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff8f1;
    color:#333;
}
header{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(to bottom,#ffe4c7,#fff8f1);
}
header h1{
    font-size:48px;
    margin-bottom:20px;
}
header p{
    font-size:20px;
    color:#666;
}
.btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 28px;
    background:#ff9f43;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}
.section{
    max-width:1200px;
    margin:auto;
    padding:60px 20px;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}
.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}
.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}
.card-content{
    padding:20px;
}
.price{
    color:#ff7b00;
    font-size:24px;
    font-weight:bold;
}
.buy-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    background:#ff9f43;
    color:white;
    text-decoration:none;
    border-radius:10px;
}
footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>
</head>
<body>

<header>
    <h1>肥富吉貴 × 啵吉</h1>
    <p>貓咪日常 × 手作溫度的小小品牌</p>
    <a class="btn" href="#products">查看商品</a>
</header>

<section class="section">
    <h2>關於我們</h2>
    <p>
    我們喜歡貓咪、手作與療癒生活。<br>
    每件商品皆為少量手工製作，希望把溫暖帶給更多人。
    </p>
</section>

<section class="section" id="products">
    <h2>人氣商品</h2>

    <div class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?q=80&w=1200&auto=format&fit=crop">
            <div class="card-content">
                <h3>大富監工款｜貓咪圍巾</h3>
                <p>柔軟舒適，適合秋冬穿搭。</p>
                <div class="price">NT$390</div>
                <a class="buy-btn" href="https://forms.gle/">我要購買</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?q=80&w=1200&auto=format&fit=crop">
            <div class="card-content">
                <h3>橘貓日常｜手作小包</h3>
                <p>療癒系日常小包包。</p>
                <div class="price">NT$590</div>
                <a class="buy-btn" href="https://forms.gle/">我要購買</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?q=80&w=1200&auto=format&fit=crop">
            <div class="card-content">
                <h3>大富限定｜貓咪吊飾</h3>
                <p>每個都是手工製作。</p>
                <div class="price">NT$250</div>
                <a class="buy-btn" href="https://forms.gle/">我要購買</a>
            </div>
        </div>

    </div>
</section>

<section class="section">
    <h2>聯絡我們</h2>
    <p>LINE：@yourlineid</p>
    <p>YouTube：你的頻道連結</p>
</section>

<footer>
© 2026 肥富吉貴 × 啵吉
</footer>

</body>
</html>
